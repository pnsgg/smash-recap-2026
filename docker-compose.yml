x-app: &app
  ports:
    - "3003:3001"
  environment:
    PORT: 3001
    RECAP_YEAR: ${RECAP_YEAR:-2026}
    SITE_URL: ${SITE_URL:-https://recap2026.pns.gg}
    REDIS_URL: redis://redis:6379
  depends_on:
    - redis
  restart: unless-stopped

services:
  app:
    <<: *app
    profiles: [prod]
    image: ghcr.io/pnsgg/smash-recap-2026:${APP_TAG:-main}

  app-local:
    <<: *app
    profiles: [local]
    image: smash-recap-2026:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  redisinsight:
    image: redis/redisinsight:latest
    profiles: [dev]
    ports:
      - "127.0.0.1:5540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: smash-recap
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  redis-data:
  redisinsight-data:
