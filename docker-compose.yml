services:
  app:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3003:3001"
    environment:
      PORT: 3001
      RECAP_YEAR: ${RECAP_YEAR:-2026}
      SITE_URL: ${SITE_URL:-https://recap2026.pns.gg}
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "127.0.0.1:5540:5540"
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: smash-recap
    volumes:
      - redisinsight-data:/data
    depends_on:
      - redis

volumes:
  redisinsight-data:
